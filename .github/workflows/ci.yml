name: CI

# Tes otomatis untuk setiap PR dan setiap push ke main.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit -p .
        env:
          # Proyek ±3.500 file: tsc butuh >2 GB heap (batas default runner) — beri ruang 6 GB.
          NODE_OPTIONS: --max-old-space-size=6144
      - name: Lint
        run: npm run lint
      - name: Tes (PGlite, tanpa database eksternal)
        run: npx vitest run
        env:
          GARAGE_DB_DRIVER: pglite
