name: Platform GIGS - nama talent SURAU -> SURAI

# Owner 19 Nov 2026: kode platform GIGS (/event, stack "garage-event") hanya ada di VPS (/root/garage-event),
# tidak di GitHub. Workflow manual ini:
#   mode=inspect : HANYA membaca (folder, container, mount, setiap kemunculan "SURAU"). Tidak mengubah apa pun.
#   mode=apply   : cadangkan file yang memuat SURAU ke /root/garage-event-backups/, ganti teks SURAU->SURAI dan
#                  Surau->Surai (huruf kecil "surau" TIDAK disentuh: itu nama file/jalur logo), lalu jalankan ulang
#                  stack platform dan cek /event masih hidup.
# File .env tidak pernah dibaca, dicetak, atau diubah. Hapus workflow ini setelah tidak dipakai.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "inspect (baca saja) atau apply (ganti + restart)"
        required: true
        default: inspect
        type: choice
        options: [inspect, apply]

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  VPS_HOST: 201.18.211.55
  VPS_USER: root
  VPS_HOST_KEY: "201.18.211.55 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIOO6lqbnNI86okZIyf1XgoF5Rr+D8JWg4RkMurApKZwj"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - name: Siapkan SSH
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "$VPS_HOST_KEY" > ~/.ssh/known_hosts

      - name: Jalankan di VPS (${{ inputs.mode }})
        env:
          MODE: ${{ inputs.mode }}
        run: |
          cat > script.sh <<'SCRIPT'
          set -uo pipefail
          MODE="$1"
          D=/root/garage-event
          C=garage-event-platform
          EXC=(--exclude='.env*' --exclude-dir=node_modules --exclude-dir=.git --exclude-dir=backups --exclude-dir=.next)

          echo "== Struktur folder $D"
          find "$D" -maxdepth 2 -not -path '*/node_modules*' -not -path '*/.git/*' -not -name '.env*' | sort | head -80
          echo "== Container event"
          docker ps -a --format '{{.Names}}  {{.Image}}  {{.Status}}' | grep -i event || true
          echo "== Mount $C"
          MOUNTS=$(docker inspect "$C" --format '{{range .Mounts}}{{.Source}}{{println}}{{end}}' 2>/dev/null | grep -v '^$' || true)
          docker inspect "$C" --format '{{range .Mounts}}{{.Type}} {{.Source}} -> {{.Destination}}{{println}}{{end}}' 2>/dev/null || true
          echo "== Workdir & isi container"
          docker exec "$C" sh -c 'pwd; ls' 2>/dev/null || true

          # Folder host yang diperiksa: stack + bind mount (bukan volume docker internal yang besar).
          ROOTS=("$D")
          for m in $MOUNTS; do case "$m" in /var/lib/docker/*) ;; "$D"*) ;; *) [ -d "$m" ] && ROOTS+=("$m");; esac; done
          VOLS=$(echo "$MOUNTS" | grep '^/var/lib/docker/volumes/' || true)
          for v in $VOLS; do [ -d "$v" ] && ROOTS+=("$v"); done
          echo "== Folder diperiksa: ${ROOTS[*]}"

          echo "== Kemunculan SURAU/Surau (teks, peka huruf)"
          grep -rnI "${EXC[@]}" -e 'SURAU' -e 'Surau' "${ROOTS[@]}" 2>/dev/null | cut -c1-240 | head -80
          echo "== Kemunculan surau huruf kecil (TIDAK diubah; biasanya jalur file)"
          grep -rnI "${EXC[@]}" -e 'surau' "${ROOTS[@]}" 2>/dev/null | cut -c1-200 | head -30
          echo "== Nama file mengandung surau"
          find "${ROOTS[@]}" -iname '*surau*' -not -path '*/node_modules/*' 2>/dev/null | head -20
          echo "== Di dalam container"
          docker exec "$C" sh -c "grep -rnI --exclude='.env*' --exclude-dir=node_modules -e SURAU -e Surau /app /data /srv /usr/src/app /home 2>/dev/null | cut -c1-200 | head -40" 2>/dev/null || true
          echo "== Database sqlite (bila ada)"
          find "${ROOTS[@]}" \( -name '*.db' -o -name '*.sqlite' -o -name '*.sqlite3' \) -not -path '*/node_modules/*' 2>/dev/null | head -10 | while read -r f; do
            printf '%s: ' "$f"; grep -c -a -e 'SURAU' -e 'Surau' "$f" || true
          done

          echo "== Container stack garage-event + mount + isi"
          CS=$(docker ps --format '{{.Names}}' | grep '^garage-event-' || true)
          for c in $CS; do
            echo "-- $c"; docker inspect "$c" --format '{{range .Mounts}}{{.Type}} {{.Source}} -> {{.Destination}}{{println}}{{end}}'
            docker inspect "$c" --format 'workdir={{.Config.WorkingDir}} compose={{index .Config.Labels "com.docker.compose.project.working_dir"}}'
            docker exec -u 0 "$c" sh -c 'grep -rn -e SURAU -e Surau . 2>/dev/null | grep -v -e "^./node_modules" -e "^./_bak" -e "\.bak" -e "Binary" | cut -c1-200 | head -20'
          done

          [ "$MODE" = "apply" ] || { echo "== Mode inspect: tidak ada yang diubah."; exit 0; }

          B=/root/garage-event-backups/surau-$(date +%Y%m%d-%H%M%S); mkdir -p "$B"
          # 1) Sumber di host (supaya build berikutnya ikut SURAI). Cadangan & folder _bak tidak disentuh.
          FILES=$(grep -rlI "${EXC[@]}" --exclude='*.bak*' --exclude-dir='_bak*' -e 'SURAU' -e 'Surau' "$D" 2>/dev/null || true)
          if [ -n "$FILES" ]; then
            echo "$FILES" | tar -czf "$B/host.tgz" -T - && echo "== Cadangan host: $B/host.tgz"
            echo "$FILES" | while read -r f; do sed -i 's/SURAU/SURAI/g; s/Surau/Surai/g' "$f" && echo "host diubah: $f"; done
          fi
          # 2) Salinan di dalam container (yang sedang tayang). Tanpa rebuild: data pendaftaran tetap.
          for c in $CS; do
            CF=$(docker exec -u 0 "$c" sh -c 'grep -rl -e SURAU -e Surau . 2>/dev/null | grep -v -e "^./node_modules" -e "^./_bak" -e "\.bak" -e "\.png$" -e "\.jpg$" -e "\.webp$"' || true)
            [ -z "$CF" ] && { echo "-- $c: tidak ada SURAU"; continue; }
            for f in $CF; do
              docker cp "$c:$(docker inspect "$c" --format '{{.Config.WorkingDir}}')/${f#./}" "$B/$c-$(echo "$f" | tr '/' '_')" 2>/dev/null || true
              docker exec -u 0 "$c" sed -i 's/SURAU/SURAI/g; s/Surau/Surai/g' "$f" && echo "$c diubah: $f"
            done
            docker restart "$c" >/dev/null && echo "-- $c dijalankan ulang"
          done
          echo "== Cadangan: $B"; ls -la "$B"
          echo "== Sisa SURAU (harus kosong)"
          grep -rnI "${EXC[@]}" --exclude='*.bak*' --exclude-dir='_bak*' -e 'SURAU' -e 'Surau' "$D" 2>/dev/null | head || true
          for c in $CS; do docker exec -u 0 "$c" sh -c 'grep -rn -e SURAU -e Surau . 2>/dev/null | grep -v -e "^./node_modules" -e "^./_bak" -e "\.bak" -e "Binary" | head'; done
          for i in $(seq 1 30); do
            curl -s -o /dev/null -w '%{http_code}' https://garagecoffee.id/event/api/events 2>/dev/null | grep -q 200 && { echo "== /event/api/events sehat (200)"; break; }
            sleep 5
          done
          echo "== Nama di API setelah ganti"
          curl -s https://garagecoffee.id/event/api/events | grep -o '"name":"[^"]*"' | head -20
          echo "== app.js tayang"
          curl -s https://garagecoffee.id/event/gigs-akhir-tahun-2026/app.js | grep -o "name: 'SURA.'" | sort | uniq -c
          SCRIPT
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes $VPS_USER@$VPS_HOST "bash -s -- $MODE" < script.sh

      - name: Hapus kunci
        if: always()
        run: rm -f ~/.ssh/deploy_key
