name: Publication Security Precheck

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publication-precheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Audit tracked files (no production secrets)
        run: node scripts/security-publication-scan.mjs
