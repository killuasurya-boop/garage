name: WMS browser UAT
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: wms-browser-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser-uat:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GARAGE_PLAYWRIGHT_ROOT: ${{ runner.temp }}/garage-wms-playwright
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build isolated production app
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=6144
          GARAGE_STANDALONE: "true"
          BETTER_AUTH_SECRET: isolated-browser-build-not-a-production-secret
          GARAGE_DB_DRIVER: postgres
          DATABASE_URL: postgresql://build:build@127.0.0.1:5432/build
          GARAGE_DISABLE_WARMUP: "true"
          GARAGE_DISABLE_BACKUPS: "true"
          GARAGE_DISABLE_AUTO_REJECT: "true"
      - name: Install test browser only in ephemeral runner
        run: |
          npm install --prefix "$GARAGE_PLAYWRIGHT_ROOT" --no-package-lock playwright@1.58.2
          "$GARAGE_PLAYWRIGHT_ROOT/node_modules/.bin/playwright" install --with-deps chromium
      - name: Mobile and desktop workflow UAT against isolated database
        run: node scripts/uat/wms-browser.mjs
      - name: Evidence (synthetic data only)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wms-browser-evidence
          path: test-artifacts/wms-browser/
          retention-days: 7
