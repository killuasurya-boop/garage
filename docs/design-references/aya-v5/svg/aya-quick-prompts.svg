<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="766" height="566" viewBox="0 0 766 566" role="img" aria-label="AYA Sample Helper Prompts">
<title>AYA Sample Helper Prompts</title><desc>Komponen SVG AYA untuk Garage Coffee</desc><defs>
<linearGradient id="prompt-silver" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFF7F2"/><stop offset=".17" stop-color="#D0C9C7"/><stop offset=".4" stop-color="#F7EEEA"/><stop offset=".63" stop-color="#89868A"/><stop offset=".79" stop-color="#F5E9E6"/><stop offset="1" stop-color="#55545C"/></linearGradient>
<linearGradient id="prompt-steel" x1=".16" y1="0" x2=".88" y2="1"><stop offset="0" stop-color="#FCF6F2"/><stop offset=".24" stop-color="#C4BEC0"/><stop offset=".59" stop-color="#655F69"/><stop offset=".79" stop-color="#E8D7D3"/><stop offset="1" stop-color="#625E66"/></linearGradient>
<linearGradient id="prompt-cream" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFF7F5"/><stop offset=".57" stop-color="#C3BEC2"/><stop offset="1" stop-color="#716C73"/></linearGradient>
<linearGradient id="prompt-visor" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2B272B"/><stop offset=".31" stop-color="#0C0D12"/><stop offset=".74" stop-color="#100D12"/><stop offset="1" stop-color="#24181A"/></linearGradient>
<linearGradient id="prompt-red" x1="0" y1="0" x2=".92" y2="1"><stop offset="0" stop-color="#FF6962"/><stop offset=".36" stop-color="#DD242A"/><stop offset=".73" stop-color="#761018"/><stop offset="1" stop-color="#3B1015"/></linearGradient>
<linearGradient id="prompt-panel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#393235"/><stop offset=".4" stop-color="#201E23"/><stop offset="1" stop-color="#151417"/></linearGradient>
<linearGradient id="prompt-border" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#968588"/><stop offset=".45" stop-color="#605155"/><stop offset="1" stop-color="#342B30"/></linearGradient>
<radialGradient id="prompt-aura"><stop offset="0" stop-color="#F03931" stop-opacity=".55"/><stop offset=".45" stop-color="#E0242C" stop-opacity=".15"/><stop offset="1" stop-color="#D42022" stop-opacity="0"/></radialGradient>
<filter id="prompt-shadow" x="-40%" y="-45%" width="190%" height="200%"><feGaussianBlur in="SourceAlpha" stdDeviation="11" result="blur"/><feOffset dy="9" result="off"/><feComponentTransfer><feFuncA type="linear" slope=".7"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="prompt-glow" x="-110%" y="-110%" width="320%" height="320%"><feGaussianBlur stdDeviation="7" result="bl"/><feMerge><feMergeNode in="bl"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="prompt-faceglow" x="-120%" y="-120%" width="340%" height="340%"><feGaussianBlur stdDeviation="3.5" result="bl"/><feMerge><feMergeNode in="bl"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<clipPath id="prompt-faceclip"><path d="M149 164 C152 118 194 99 258 98 C327 99 360 119 371 159 Q388 218 364 254 C338 283 191 292 157 265 C133 247 134 197 149 164 Z"/></clipPath>
</defs>

<rect x="8" y="8" width="750" height="550" rx="24" fill="#171619" stroke="#71585B" stroke-width="2"/><text x="34" y="53" fill="#F4ECE9" fill-opacity="1" font-family="Inter, Arial, Helvetica, sans-serif" font-size="26" font-weight="750" text-anchor="start">CONTOH PROMPT AYA</text><rect x="31" y="81" width="703" height="79" rx="14" fill="url(#prompt-panel)" stroke="#69585A" stroke-width="1.6"/><text x="60" y="129" fill="#FF776E" fill-opacity="1" font-family="Inter, Arial, Helvetica, sans-serif" font-size="22" font-weight="750" text-anchor="start">01</text><text x="106" y="114" fill="#F4ECE9" fill-opacity="1" font-family="Inter, Arial, Helvetica, sans-serif" font-size="22" font-weight="570" text-anchor="start">Rekomendasikan menu kopi</text><text x="106" y="139" fill="#F4ECE9" fill-opacity="1" font-family="Inter, Arial, Helvetica, sans-serif" font-size="22" font-weight="570" text-anchor="start">paling favorit di Garage Coffee.</text><path d="M692 110 l16 12 l-16 12" stroke="#F8ECEA" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/><rect x="31" y="172" width="703" height="79" rx="14" fill="url(#prompt-panel)" stroke="#69585A" stroke-width="1.6"/><text x="60" y="220" fill="#FF776E" fill-opacity="1" font-family="Inter, Arial, Helvetica, sans-serif" font-size="22" font-weight="750" text-anchor="start">02</text><text x="106" y="205" fill="#F4ECE9" fill-opacity="1" font-family="Inter, Arial, Helvetica, sans-serif" font-size="22" font-weight="570" text-anchor="start">Ada menu minuman dingin</text><text x="106" y="230" fill="#F4ECE9" fill-opacity="1" font-family="Inter, Arial, Helvetica, sans-serif" font-size="22" font-weight="570" text-anchor="start">yang segar?</text><path d="M692 201 l16 12 l-16 12" stroke="#F8ECEA" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/><rect x="31" y="263" width="703" height="79" rx="14" fill="url(#prompt-panel)" stroke="#69585A" stroke-width="1.6"/><text x="60" y="311" fill="#FF776E" fill-opacity="1" font-family="Inter, Arial, Helvetica, sans-serif" font-size="22" font-weight="750" text-anchor="start">03</text><text x="106" y="296" fill="#F4ECE9" fill-opacity="1" font-family="Inter, Arial, Helvetica, sans-serif" font-size="22" font-weight="570" text-anchor="start">Rekomendasikan menu kopi</text><text x="106" y="321" fill="#F4ECE9" fill-opacity="1" font-family="Inter, Arial, Helvetica, sans-serif" font-size="22" font-weight="570" text-anchor="start">dengan rasa bold.</text><path d="M692 292 l16 12 l-16 12" stroke="#F8ECEA" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/><rect x="31" y="354" width="703" height="79" rx="14" fill="url(#prompt-panel)" stroke="#69585A" stroke-width="1.6"/><text x="60" y="402" fill="#FF776E" fill-opacity="1" font-family="Inter, Arial, Helvetica, sans-serif" font-size="22" font-weight="750" text-anchor="start">04</text><text x="106" y="387" fill="#F4ECE9" fill-opacity="1" font-family="Inter, Arial, Helvetica, sans-serif" font-size="22" font-weight="570" text-anchor="start">Menu apa yang cocok</text><text x="106" y="412" fill="#F4ECE9" fill-opacity="1" font-family="Inter, Arial, Helvetica, sans-serif" font-size="22" font-weight="570" text-anchor="start">untuk pendamping kerja?</text><path d="M692 383 l16 12 l-16 12" stroke="#F8ECEA" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/><rect x="31" y="445" width="703" height="79" rx="14" fill="url(#prompt-panel)" stroke="#69585A" stroke-width="1.6"/><text x="60" y="493" fill="#FF776E" fill-opacity="1" font-family="Inter, Arial, Helvetica, sans-serif" font-size="22" font-weight="750" text-anchor="start">05</text><text x="106" y="478" fill="#F4ECE9" fill-opacity="1" font-family="Inter, Arial, Helvetica, sans-serif" font-size="22" font-weight="570" text-anchor="start">Ada menu spesial</text><text x="106" y="503" fill="#F4ECE9" fill-opacity="1" font-family="Inter, Arial, Helvetica, sans-serif" font-size="22" font-weight="570" text-anchor="start">yang bisa dicoba hari ini?</text><path d="M692 474 l16 12 l-16 12" stroke="#F8ECEA" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>