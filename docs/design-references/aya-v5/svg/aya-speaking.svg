<!-- left ear shell and badge -->
<ellipse cx="119" cy="213" rx="67" ry="83" fill="url(#s4-steel)" stroke="#817478" stroke-width="5"/>
<ellipse cx="115" cy="217" rx="48" ry="63" fill="#1A161B" stroke="#756363" stroke-width="5"/>
<ellipse cx="115" cy="217" rx="41" ry="54" fill="#181318" stroke="#3F292C" stroke-width="2"/>
<g transform="translate(92 188) scale(1.02)"><path d="M0 49 L24 0 L48 49 H35 L29 37 H19 L13 49 Z M24 13 L19 28 H29 Z" fill="#E83F37" fill-rule="evenodd"/><path d="M9 42 L39 42" stroke="#FF8680" stroke-width="2.5" stroke-opacity=".6"/><path d="M27 24 L39 36" stroke="#80111A" stroke-width="2.3"/></g>
<path d="M87 160 Q113 144 139 162" stroke="#FFF8F5" stroke-width="7" opacity=".36" fill="none" stroke-linecap="round"/>
<!-- silver seam -->
<path d="M160 97 L173 106 M308 76 L315 85" stroke="#8C8287" stroke-width="2" opacity=".5"/>
<!-- face expressions -->
</g><g class="aya-face">
<g filter="url(#s4-faceglow)"><path d="M195 194 Q208 174 221 194" fill="none" stroke="#FFEDEA" stroke-width="8" stroke-linecap="round"/><path d="M244 196 v9" stroke="#FFECEA" stroke-width="5.8" stroke-linecap="round"/><path d="M256 184 v34" stroke="#FFECEA" stroke-width="5.8" stroke-linecap="round"/><path d="M269 176 v49" stroke="#FFECEA" stroke-width="5.8" stroke-linecap="round"/><path d="M282 185 v31" stroke="#FFECEA" stroke-width="5.8" stroke-linecap="round"/><path d="M294 196 v9" stroke="#FFECEA" stroke-width="5.8" stroke-linecap="round"/></g>
</g>
</g>
<g><path d="M355 68 Q355 46 379 46 H444 Q465 46 465 68 V92 Q465 111 445 111 H395 L375 125 L377 109 Q355 104 355 92Z" fill="#242023" stroke="#BFB5B6" stroke-width="2"/><path d="M380 69 H440 M380 82 H431" stroke="#FFF0E8" stroke-width="4" stroke-linecap="round"/><g stroke="#FF726A" stroke-width="4" stroke-linecap="round" filter="url(#s4-faceglow)"><path d="M427 174 V208 M438 165 V217 M450 179 V203"/></g></g>
</g>
</svg>