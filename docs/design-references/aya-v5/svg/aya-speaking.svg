<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="480" height="480" viewBox="0 0 480 480" role="img" aria-label="AYA Speaking - SVG Vector">
<title>AYA Speaking - SVG Vector</title><desc>Karakter robot AYA state speaking, vektor editable, latar transparan.</desc><defs>
<linearGradient id="s4-silver" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFF7F2"/><stop offset=".17" stop-color="#D0C9C7"/><stop offset=".4" stop-color="#F7EEEA"/><stop offset=".63" stop-color="#89868A"/><stop offset=".79" stop-color="#F5E9E6"/><stop offset="1" stop-color="#55545C"/></linearGradient>
<linearGradient id="s4-steel" x1=".16" y1="0" x2=".88" y2="1"><stop offset="0" stop-color="#FCF6F2"/><stop offset=".24" stop-color="#C4BEC0"/><stop offset=".59" stop-color="#655F69"/><stop offset=".79" stop-color="#E8D7D3"/><stop offset="1" stop-color="#625E66"/></linearGradient>
<linearGradient id="s4-cream" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFF7F5"/><stop offset=".57" stop-color="#C3BEC2"/><stop offset="1" stop-color="#716C73"/></linearGradient>
<linearGradient id="s4-visor" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2B272B"/><stop offset=".31" stop-color="#0C0D12"/><stop offset=".74" stop-color="#100D12"/><stop offset="1" stop-color="#24181A"/></linearGradient>
<linearGradient id="s4-red" x1="0" y1="0" x2=".92" y2="1"><stop offset="0" stop-color="#FF6962"/><stop offset=".36" stop-color="#DD242A"/><stop offset=".73" stop-color="#761018"/><stop offset="1" stop-color="#3B1015"/></linearGradient>
<linearGradient id="s4-panel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#393235"/><stop offset=".4" stop-color="#201E23"/><stop offset="1" stop-color="#151417"/></linearGradient>
<linearGradient id="s4-border" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#968588"/><stop offset=".45" stop-color="#605155"/><stop offset="1" stop-color="#342B30"/></linearGradient>
<radialGradient id="s4-aura"><stop offset="0" stop-color="#F03931" stop-opacity=".55"/><stop offset=".45" stop-color="#E0242C" stop-opacity=".15"/><stop offset="1" stop-color="#D42022" stop-opacity="0"/></radialGradient>
<filter id="s4-shadow" x="-40%" y="-45%" width="190%" height="200%"><feGaussianBlur in="SourceAlpha" stdDeviation="11" result="blur"/><feOffset dy="9" result="off"/><feComponentTransfer><feFuncA type="linear" slope=".7"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="s4-glow" x="-110%" y="-110%" width="320%" height="320%"><feGaussianBlur stdDeviation="7" result="bl"/><feMerge><feMergeNode in="bl"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="s4-faceglow" x="-120%" y="-120%" width="340%" height="340%"><feGaussianBlur stdDeviation="3.5" result="bl"/><feMerge><feMergeNode in="bl"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<clipPath id="s4-faceclip"><path d="M149 164 C152 118 194 99 258 98 C327 99 360 119 371 159 Q388 218 364 254 C338 283 191 292 157 265 C133 247 134 197 149 164 Z"/></clipPath>
</defs>

<g class="aya-robot aya-speaking">
