<g><circle cx="151" cy="358" r="47" fill="url(#s4-steel)" stroke="#514D55" stroke-width="5"/><circle cx="149" cy="365" r="31" fill="url(#s4-cream)" stroke="#AAA1A2" stroke-width="3"/><circle cx="367" cy="359" r="46" fill="url(#s4-steel)" stroke="#514D55" stroke-width="5"/><circle cx="369" cy="366" r="31" fill="url(#s4-cream)" stroke="#AAA1A2" stroke-width="3"/><circle cx="178" cy="403" r="36" fill="url(#s4-silver)" stroke="#8B7C7F" stroke-width="4"/><circle cx="337" cy="403" r="36" fill="url(#s4-silver)" stroke="#8B7C7F" stroke-width="4"/></g>
</g>
