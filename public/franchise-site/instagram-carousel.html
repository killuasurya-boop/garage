<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GARAGE Franchise · Instagram Carousel Ads</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;500;600;700;800;900&family=Barlow+Condensed:wght@600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="design-canvas.jsx"></script>

<style>
  :root {
    --black: #0A0A0A; --black-2: #131313; --line: #262626; --line-2: #333;
    --chrome: #C0C0C0; --chrome-dim: #8a8a8a; --white: #f5f5f5;
    --red: #CC0000; --red-bright: #ff1f1f; --amber: #F59E0B; --hud: #00ff9c;
  }
  body { margin: 0; font-family: 'Barlow', sans-serif; -webkit-font-smoothing: antialiased; }

  /* IG frame base */
  .ig {
    width: 1080px; height: 1080px;
    background: var(--black);
    color: var(--white);
    position: relative;
    overflow: hidden;
    font-family: 'Barlow', sans-serif;
  }
  .ig::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    opacity: .06; mix-blend-mode: overlay; z-index: 10;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='1.8' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  }

  .ig h1, .ig h2, .ig h3 { font-family: 'Bebas Neue', sans-serif; font-weight: 400; letter-spacing: .02em; line-height: .88; margin: 0; }
  .ig .mono { font-family: 'JetBrains Mono', monospace; }
  .ig .red { color: var(--red); }
  .ig .amber { color: var(--amber); }

  /* Top/bottom strips */
  .ig-top {
    position: absolute; top: 60px; left: 60px; right: 60px;
    display: flex; justify-content: space-between; align-items: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 18px; letter-spacing: .26em; text-transform: uppercase;
    color: var(--chrome-dim);
    z-index: 5;
  }
  .ig-top .brand { display: flex; gap: 14px; align-items: center; }
  .ig-top .brand .mark { width: 36px; height: 36px; background: var(--black-2); border: 1px solid var(--line-2); display: grid; place-items: center; }
  .ig-top .brand strong { font-family: 'Bebas Neue', sans-serif; font-size: 26px; color: var(--white); letter-spacing: .12em; }
  .ig-bot {
    position: absolute; bottom: 60px; left: 60px; right: 60px;
    display: flex; justify-content: space-between; align-items: flex-end;
    font-family: 'JetBrains Mono', monospace;
    font-size: 16px; letter-spacing: .22em; text-transform: uppercase;
    color: var(--chrome-dim);
    z-index: 5;
  }
  .ig-bot .swipe { display: flex; gap: 12px; align-items: center; color: var(--red); }
  .ig-bot .swipe svg { width: 28px; height: 28px; animation: nudge 1.4s ease-in-out infinite; }
  @keyframes nudge { 50% { transform: translateX(6px); } }

  .ig-body { position: absolute; inset: 0; padding: 130px 80px; z-index: 2; display: flex; flex-direction: column; justify-content: center; }

  .eyebrow {
    display: inline-flex; align-items: center; gap: 16px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 18px; letter-spacing: .3em; text-transform: uppercase;
    color: var(--red);
    margin-bottom: 32px;
  }
  .eyebrow::before { content: ""; width: 60px; height: 1px; background: var(--red); }

  /* ===== FRAME 1: HOOK ===== */
  .f1 {
    background:
      radial-gradient(700px 600px at 75% 30%, rgba(204,0,0,.25), transparent 60%),
      linear-gradient(180deg, #0a0a0a 0%, #050505 100%);
  }
  .f1::before {
    content: ""; position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.04) 1px, transparent 1px);
    background-size: 90px 90px;
    mask-image: radial-gradient(ellipse 85% 65% at 50% 50%, #000 30%, transparent 80%);
  }
  .f1 h1 { font-size: 220px; letter-spacing: -.02em; }
  .f1 .sub { font-family: 'Barlow Condensed', sans-serif; font-size: 36px; font-weight: 600; color: var(--chrome); margin-top: 32px; line-height: 1.3; max-width: 800px; }
  .f1 .price-tag {
    position: absolute; right: 60px; bottom: 160px;
    background: var(--red); color: white;
    padding: 24px 32px;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 56px;
    letter-spacing: .04em;
    line-height: 1;
    clip-path: polygon(14px 0, 100% 0, 100% calc(100% - 14px), calc(100% - 14px) 100%, 0 100%, 0 14px);
    box-shadow: 0 20px 50px rgba(204,0,0,.4);
    z-index: 6;
  }
  .f1 .price-tag .small { font-family: 'Barlow Condensed', sans-serif; font-size: 18px; font-weight: 700; letter-spacing: .14em; display: block; margin-bottom: 6px; text-transform: uppercase; }

  /* ===== FRAME 2: PROBLEM ===== */
  .f2 { background: var(--black); }
  .f2 .left { font-size: 140px; line-height: .88; }
  .f2 .left .x { color: var(--red); }
  .f2-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-top: 56px; }
  .f2-cell {
    background: var(--black-2); border: 1px solid var(--line-2);
    padding: 32px;
  }
  .f2-cell .ic { font-family: 'Bebas Neue', sans-serif; color: var(--red); font-size: 56px; line-height: 1; margin-bottom: 14px; }
  .f2-cell h4 { font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 26px; text-transform: uppercase; letter-spacing: .04em; margin-bottom: 10px; }
  .f2-cell p { color: var(--chrome); font-size: 20px; margin: 0; line-height: 1.4; }

  /* ===== FRAME 3: SOLUTION ===== */
  .f3 {
    background:
      radial-gradient(800px 500px at 20% 80%, rgba(0,255,156,.08), transparent 60%),
      var(--black);
  }
  .f3 h2 { font-size: 130px; line-height: .9; }
  .f3 .pillars { display: grid; grid-template-columns: repeat(2, 1fr); gap: 18px; margin-top: 56px; }
  .f3 .pl {
    background: linear-gradient(135deg, var(--black-2), var(--black));
    border: 1px solid var(--line-2);
    padding: 28px;
    position: relative;
  }
  .f3 .pl .n {
    position: absolute; top: 16px; right: 20px;
    font-family: 'JetBrains Mono', monospace; font-size: 14px;
    color: var(--chrome-dim); letter-spacing: .22em;
  }
  .f3 .pl .ico {
    width: 56px; height: 56px;
    border: 1px solid var(--line-2);
    display: grid; place-items: center;
    color: var(--red); margin-bottom: 16px;
  }
  .f3 .pl .ico svg { width: 26px; height: 26px; }
  .f3 .pl h4 { font-family: 'Bebas Neue', sans-serif; font-size: 36px; margin-bottom: 8px; }
  .f3 .pl p { color: var(--chrome); font-size: 17px; margin: 0; line-height: 1.4; }

  /* ===== FRAME 4: NUMBERS ===== */
  .f4 {
    background:
      radial-gradient(700px 500px at 80% 25%, rgba(204,0,0,.18), transparent 60%),
      var(--black);
  }
  .f4 h2 { font-size: 110px; line-height: .9; }
  .f4 .nums { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1px; background: var(--line); border: 1px solid var(--line-2); margin-top: 48px; }
  .f4 .nc { background: var(--black); padding: 36px 32px; }
  .f4 .nc .v {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 140px; line-height: .85;
  }
  .f4 .nc .v.red { color: var(--red); }
  .f4 .nc .v.amber { color: var(--amber); }
  .f4 .nc .v.hud { color: var(--hud); }
  .f4 .nc .v .sm { font-size: 44px; color: var(--chrome-dim); margin-left: 6px; vertical-align: top; }
  .f4 .nc .l { font-family: 'JetBrains Mono', monospace; font-size: 13px; letter-spacing: .22em; color: var(--chrome-dim); margin-top: 14px; text-transform: uppercase; }
  .f4 .nc .d { color: var(--chrome); font-size: 17px; margin-top: 8px; line-height: 1.4; }

  /* ===== FRAME 5: CTA ===== */
  .f5 {
    background:
      radial-gradient(800px 600px at 50% 40%, rgba(204,0,0,.3), transparent 60%),
      linear-gradient(180deg, #1a0707 0%, #050505 100%);
  }
  .f5 h2 { font-size: 160px; line-height: .88; }
  .f5 .sub { font-family: 'Barlow Condensed', sans-serif; font-size: 32px; font-weight: 600; color: var(--chrome); margin: 32px 0 60px; line-height: 1.3; max-width: 800px; }
  .f5 .cta-box {
    background: var(--black);
    border: 1px solid var(--red);
    padding: 36px 40px;
    display: inline-flex;
    flex-direction: column;
    margin-bottom: 24px;
  }
  .f5 .cta-box .l { font-family: 'JetBrains Mono', monospace; font-size: 16px; letter-spacing: .26em; color: var(--chrome-dim); text-transform: uppercase; margin-bottom: 14px; }
  .f5 .cta-box .v {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 80px;
    color: var(--white);
    letter-spacing: .04em;
    line-height: 1;
  }
  .f5 .cta-box .v.red { color: var(--red); }
  .f5 .cta-row { display: flex; gap: 18px; align-items: center; margin-top: 16px; }
  .f5 .cta-btn {
    display: inline-flex; gap: 16px; align-items: center;
    background: var(--red); color: white;
    padding: 28px 40px;
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 800; letter-spacing: .18em; text-transform: uppercase;
    font-size: 26px;
    clip-path: polygon(14px 0, 100% 0, 100% calc(100% - 14px), calc(100% - 14px) 100%, 0 100%, 0 14px);
    box-shadow: 0 16px 40px rgba(204,0,0,.35);
  }
  .f5 .cta-btn svg { width: 28px; height: 28px; }
  .f5 .tagline {
    position: absolute; bottom: 130px; left: 80px; right: 80px;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 48px;
    letter-spacing: .04em;
    line-height: 1;
    padding-top: 40px;
    border-top: 1px solid var(--line-2);
    color: var(--chrome);
  }
  .f5 .tagline .red { color: var(--red); }

  /* Brand mark SVG */
  .gmark { width: 22px; height: 22px; }
</style>
</head>
<body>

<script type="text/babel">
const { useState } = React;

const Mark = () => (
  <svg className="gmark" viewBox="0 0 32 32" fill="none">
    <path d="M16 4 L28 26 L4 26 Z" stroke="#C0C0C0" strokeWidth="2"/>
    <path d="M16 12 L22 24 L14 24 Z" fill="#CC0000"/>
  </svg>
);

const TopStrip = ({ idx }) => (
  <div className="ig-top">
    <div className="brand">
      <div className="mark"><Mark /></div>
      <strong>GARAGE</strong>
    </div>
    <span>● FRANCHISE 2026 · {String(idx).padStart(2, '0')} / 05</span>
  </div>
);

const BotStrip = ({ text, swipe }) => (
  <div className="ig-bot">
    <span>@garage.id · franchise inquiry</span>
    {swipe && (
      <span className="swipe">
        SWIPE
        <svg viewBox="0 0 24 24" fill="none"><path d="M5 12h14m0 0-6-6m6 6-6 6" stroke="currentColor" strokeWidth="2.5"/></svg>
      </span>
    )}
  </div>
);

// =========== FRAME 1: HOOK ===========
const Frame1 = () => (
  <div className="ig f1">
    <TopStrip idx={1} />
    <div className="ig-body">
      <div className="eyebrow">Franchise Coffee · Open 2026</div>
      <h1>Modal<br/>Rp 75jt.<br/><span className="red">Margin 67%.</span></h1>
      <p className="sub">Franchise coffee shop yang punya teknologi sendiri. Dari sistem, training, sampai pendampingan.</p>
    </div>
    <div className="price-tag">
      <span className="small">Mulai Dari</span>
      Rp 75jt
    </div>
    <BotStrip swipe />
  </div>
);

// =========== FRAME 2: PROBLEM ===========
const Frame2 = () => (
  <div className="ig f2">
    <TopStrip idx={2} />
    <div className="ig-body">
      <div className="eyebrow">Kenapa Banyak Coffee Shop Tutup?</div>
      <h2 className="left">73<span className="x">%</span><br/>tutup dalam<br/><span className="x">2 tahun.</span></h2>
      <div className="f2-grid">
        <div className="f2-cell">
          <div className="ic">✕</div>
          <h4>Operasi Manual</h4>
          <p>Kasir buku tulis, kitchen pakai memo, stok dihitung sebulan sekali.</p>
        </div>
        <div className="f2-cell">
          <div className="ic">✕</div>
          <h4>Margin Tipis</h4>
          <p>Tidak ada leverage supply chain. Margin tergerus operasional.</p>
        </div>
        <div className="f2-cell">
          <div className="ic">✕</div>
          <h4>SOP Inkonsisten</h4>
          <p>Rasa berubah-ubah. Customer tidak balik. Brand tidak terbentuk.</p>
        </div>
        <div className="f2-cell">
          <div className="ic">✕</div>
          <h4>Owner Burnt Out</h4>
          <p>Standby di outlet tiap hari. Mustahil scale ke outlet ke-2.</p>
        </div>
      </div>
    </div>
    <BotStrip swipe />
  </div>
);

// =========== FRAME 3: SOLUTION ===========
const Frame3 = () => (
  <div className="ig f3">
    <TopStrip idx={3} />
    <div className="ig-body">
      <div className="eyebrow">Solusi · GARAGE OS</div>
      <h2>Sistem operasi<br/>untuk industri<br/><span className="red">kedai kopi.</span></h2>
      <div className="pillars">
        <div className="pl">
          <div className="n">01</div>
          <div className="ico"><svg viewBox="0 0 32 32" fill="none"><rect x="4" y="6" width="24" height="16" rx="1" stroke="currentColor" strokeWidth="2"/><path d="M4 11h24M10 26h12M16 22v4" stroke="currentColor" strokeWidth="2"/></svg></div>
          <h4>Teknologi Proprietary</h4>
          <p>POS, QR Menu, KDS, Loyalty App, Owner Dashboard — semua in-house.</p>
        </div>
        <div className="pl">
          <div className="n">02</div>
          <div className="ico"><svg viewBox="0 0 32 32" fill="none"><path d="M6 4h16l4 4v20H6z" stroke="currentColor" strokeWidth="2"/><path d="M22 4v4h4M10 14h12M10 18h12" stroke="currentColor" strokeWidth="2"/></svg></div>
          <h4>15 Modul SOP Digital</h4>
          <p>Rekrutmen sampai krisis. Owner non-F&amp;B bisa langsung jalan.</p>
        </div>
        <div className="pl">
          <div className="n">03</div>
          <div className="ico"><svg viewBox="0 0 32 32" fill="none"><path d="M4 26 L12 18 L18 22 L28 8" stroke="currentColor" strokeWidth="2"/><path d="M20 8h8v8" stroke="currentColor" strokeWidth="2"/></svg></div>
          <h4>Gross Margin 67%</h4>
          <p>Supply chain langsung dari farm partner. Marjin sehat day-1.</p>
        </div>
        <div className="pl">
          <div className="n">04</div>
          <div className="ico"><svg viewBox="0 0 32 32" fill="none"><circle cx="12" cy="12" r="5" stroke="currentColor" strokeWidth="2"/><circle cx="22" cy="14" r="4" stroke="currentColor" strokeWidth="2"/><path d="M4 28c0-5 4-8 8-8s8 3 8 8M18 28c0-3.5 2-6 6-6s6 2 6 6" stroke="currentColor" strokeWidth="2"/></svg></div>
          <h4>Komunitas Owner</h4>
          <p>Private group, support harian, pendampingan 30 hari post-launch.</p>
        </div>
      </div>
    </div>
    <BotStrip swipe />
  </div>
);

// =========== FRAME 4: NUMBERS ===========
const Frame4 = () => (
  <div className="ig f4">
    <TopStrip idx={4} />
    <div className="ig-body">
      <div className="eyebrow">Unit Economics · Steady State</div>
      <h2>Bukan janji.<br/><span className="red">Angka nyata.</span></h2>
      <div className="nums">
        <div className="nc">
          <div className="v red">67<span className="sm">%</span></div>
          <div className="l">// Gross Margin / Cup</div>
          <div className="d">Harga Rp 35rb · COGS Rp 11,5rb</div>
        </div>
        <div className="nc">
          <div className="v">Rp 270<span className="sm">jt</span></div>
          <div className="l">// Revenue / Bulan</div>
          <div className="d">Base case 200 cup/hari</div>
        </div>
        <div className="nc">
          <div className="v amber">23<span className="sm">%</span></div>
          <div className="l">// EBITDA Steady</div>
          <div className="d">≈ Rp 62,7 jt/bulan</div>
        </div>
        <div className="nc">
          <div className="v hud">11–14<span className="sm">bln</span></div>
          <div className="l">// Break-Even</div>
          <div className="d">Modal kembali &lt; 14 bulan</div>
        </div>
      </div>
    </div>
    <BotStrip swipe />
  </div>
);

// =========== FRAME 5: CTA ===========
const Frame5 = () => (
  <div className="ig f5">
    <TopStrip idx={5} />
    <div className="ig-body" style={{ paddingBottom: 320 }}>
      <div className="eyebrow">Ready to Build?</div>
      <h2>Mulai<br/>hari ini.</h2>
      <p className="sub">Konsultasi gratis, tanpa komitmen. Kami balas dalam 15 menit di jam kerja.</p>

      <div className="cta-box">
        <div className="l">// WhatsApp Franchise</div>
        <div className="v red">+62 813 9618 6251</div>
      </div>

      <div className="cta-row">
        <div className="cta-btn">
          Chat Sekarang
          <svg viewBox="0 0 24 24" fill="none"><path d="M5 12h14m0 0-6-6m6 6-6 6" stroke="currentColor" strokeWidth="2.5"/></svg>
        </div>
      </div>
    </div>
    <div className="tagline">
      "Built in the <span className="red">Garage</span>,<br/>Brewed for the World."
    </div>
    <BotStrip />
  </div>
);

// ===== CANVAS APP =====
const App = () => (
  <DCCanvas
    title="GARAGE · Instagram Carousel Ads"
    subtitle="5 frames · 1080×1080 · siap upload ke Meta Ads Manager"
  >
    <DCSection id="carousel" title="Carousel Ads · Franchise Launch 2026" defaultExpanded>
      <DCArtboard id="f1" label="Frame 01 · Hook (Price tag)" width={1080} height={1080}>
        <Frame1 />
      </DCArtboard>
      <DCArtboard id="f2" label="Frame 02 · Problem (73% tutup)" width={1080} height={1080}>
        <Frame2 />
      </DCArtboard>
      <DCArtboard id="f3" label="Frame 03 · Solution (4 pillars)" width={1080} height={1080}>
        <Frame3 />
      </DCArtboard>
      <DCArtboard id="f4" label="Frame 04 · Numbers (Unit economics)" width={1080} height={1080}>
        <Frame4 />
      </DCArtboard>
      <DCArtboard id="f5" label="Frame 05 · CTA (WhatsApp)" width={1080} height={1080}>
        <Frame5 />
      </DCArtboard>
    </DCSection>
  </DCCanvas>
);

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>

<div id="root"></div>

</body>
</html>
